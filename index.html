<title>ジェムクラフト — 宝石工房 v3.5 / Gem Craft: Jewel Workshop</title>
<style>
:root{--bg:#1b1512;--panel:#2a211c;--panel2:#34281f;--line:#4a3a2d;--ink:#f4e9dc;--sub:#b9a58f;--acc:#f0a24a;--good:#7fd18b;--bad:#e56b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 14px 8px;background:linear-gradient(#2f241c,#1b1512);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gold{font-size:22px;font-weight:700;color:var(--acc)}
.rank{font-size:12px;color:var(--sub)}
.bar{height:10px;background:#120d0a;border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d97a2b,#f3c15a);transition:width .2s}
.btn{background:var(--acc);color:#2a1a0a;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px;font-family:inherit}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 8px;font-size:12px;white-space:nowrap}
main{flex:1;padding:12px 14px 20px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;display:flex;background:#241b15;border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:9px 0 8px;font-size:11px;font-family:inherit}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--acc)}
nav.many button{font-size:10px}
nav.many button b{font-size:18px}
html[lang=en] .ja-only{display:none}
html[lang=ja] .en-only{display:none}
body.awake{--acc:#ffd35a}
body.awake header{background:linear-gradient(#4a3611,#1b1512);border-bottom-color:#b8892a}
body.awake nav{border-top-color:#b8892a}
body.awake .card{border-color:#6b5320}
body.awake .gold{background:linear-gradient(90deg,#fff3b0,#ffc83a,#fff3b0);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
body.awake #pick{filter:drop-shadow(0 0 7px #ffd35a)}
@keyframes shine{to{background-position:-200% 0}}
.hall{border:2px solid #7a5a2a;border-radius:14px;padding:10px;margin-bottom:10px;background:radial-gradient(circle at 50% 0,#ffffff22,transparent 60%),var(--wall)}
.hall.l4{border-color:#ffd35a;box-shadow:0 0 18px #ffd35a66;animation:gl2 2.4s ease-in-out infinite alternate}
@keyframes gl2{from{box-shadow:0 0 8px #ffd35a44}to{box-shadow:0 0 24px #ffd35aaa}}
.hall .ttl{text-align:center;font-weight:700;margin-bottom:6px;color:#ffe9b0}
.shelf{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px 2px 10px;border-bottom:6px solid #5a3a1a;margin-bottom:8px;background:linear-gradient(transparent 70%,#0004)}
.slot{width:64px;text-align:center;font-size:10px;line-height:1.3}
.slot.dim{opacity:.22;filter:grayscale(1)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:2px;vertical-align:top}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:14px;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;position:relative;font-family:inherit;color:var(--ink)}
.item.sel{border-color:var(--acc);box-shadow:0 0 0 2px #f0a24a55}
.item.rare{border-color:var(--gc);animation:gl 1.6s ease-in-out infinite alternate}
@keyframes gl{from{box-shadow:0 0 3px var(--gc)}to{box-shadow:0 0 14px var(--gc)}}
.item small{display:block;color:var(--sub);margin-top:2px}
.muted{color:var(--sub);font-size:12px}
#stage{position:relative;width:260px;height:230px;margin:6px auto;touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer}
#rockwrap{position:absolute;left:20px;top:35px}
#pick{position:absolute;left:185px;top:40px;width:70px;height:130px;transform-origin:50% 100%;transform:rotate(30deg);pointer-events:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
#toast{white-space:pre-line;position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:16px;overflow:hidden}
#ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:420px;text-align:center;position:relative}
.track{position:relative;height:34px;background:#120d0a;border-radius:10px;border:1px solid var(--line);margin:14px 0;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#7fd18b66;border-left:2px solid var(--good);border-right:2px solid var(--good)}
.mk{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#120d0a;border:1px solid var(--line);margin:2px}
.up{color:var(--good)}.dn{color:var(--bad)}
.opts{display:flex;gap:6px;margin:6px 0}
.opts button{flex:1}
.opts.g2{display:grid;grid-template-columns:1fr 1fr}
.reveal{position:relative;text-align:center;width:100%;max-width:360px}
.rays{position:absolute;left:50%;top:75px;width:440px;height:440px;margin:-220px 0 0 -220px;background:repeating-conic-gradient(from 0deg,var(--gc) 0 7deg,transparent 7deg 20deg);opacity:.5;border-radius:50%;animation:spin 8s linear infinite;-webkit-mask:radial-gradient(circle,#000 8%,transparent 68%);mask:radial-gradient(circle,#000 8%,transparent 68%)}
.gbig{position:relative;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 0 22px var(--gc))}
.rt{position:relative;font-size:26px;font-weight:800;letter-spacing:.12em;color:#fff;text-shadow:0 0 12px var(--gc),0 0 26px var(--gc);margin-top:10px}
.rn{position:relative;font-size:16px;margin-top:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.oc{display:flex;gap:10px;align-items:flex-start}
.oc .face{font-size:34px;line-height:1}
footer{padding:14px 14px 90px;text-align:center;font-size:11px;color:var(--sub)}
</style>
</head>

nder the room", "👑 王室御用達": "👑 Royal Warrant", "女王のティアラ(品質{0})と、王の王冠(品質{1})を納めた。": "You delivered the Queen's Tiara (quality {0}) and the King's Crown (quality {1}).", "エンディングをもう一度見る": "Watch the ending again", "🏛 黄金の玉座": "🏛 Golden Throne", "修行の果てに、玉座を仕上げた(品質{0})。": "At the end of your training, you finished the throne (quality {0}).", "もうひとつのエンディングを見る": "Watch the other ending", "<br>修行で全部の強化をLv15にすると、何かが起こるかも…": "<br>Max out all six upgrades to Lv15 in Mastery mode, and something might happen…", "ここから先は自由な時間。図鑑のコンプリート(強化タブ)や、もっと高価な宝石づくりを楽しもう。{0}": "From here on, it is free time. Enjoy completing the Gem Index (Upgrade tab) and crafting even pricier gems.{0}", "報酬": "Reward", "(制作費を引くと +{0}G)": " (+{0}G after cost)", "女王のティアラ、完成!": "The Queen's Tiara, Complete!", "出来栄えは「{0}」(品質 {1})。": "The result: “{0}” (quality {1}).", "ティアラを受け取った女王は、しばらく言葉もなく見つめ、それから静かに微笑んだ。「わたくしの髪に、星が降りてきたようね」": "The Queen took the tiara and gazed at it in silence for a long while, then smiled softly. “It is as though stars have come down into my hair.”", "その噂を聞きつけて、王からも使者が来た。「王の王冠を、あなたに頼みたい」": "Word spread, and a messenger came from the King as well. “I would like you to make the King’s Crown.”", "次の依頼へ": "To the next commission", "王の王冠、完成!": "The King's Crown, Complete!", "戴冠式の日。王の頭上で、あなたの王冠が青く静かに輝いた。": "On coronation day, your crown shone a quiet blue above the King’s head.", "つづく": "To be continued", "黄金の玉座、完成!": "The Golden Throne, Complete!", "玉座は王宮の広間の中央に据えられた。ピンクダイヤ、パライバ、ブルーダイヤ、パパラチア。四つの輝きが、星座のように並んで光る。": "The throne was placed at the center of the palace hall. Pink Diamond, Paraiba, Blue Diamond, Padparadscha. Four brilliances shine side by side like a constellation.", "王は玉座に腰を下ろし、長いあいだ黙っていた。そして静かに言った。「これほどのものを作れる者は、もう他にいない」": "The King sat down on the throne and said nothing for a long time. Then, quietly: “There is no one else who could make such a thing.”", "結末へ": "To the ending", "/ 最高傑作 {0}({1}G)": " / Finest work {0} ({1}G)", "ジェムクラフト エンディング到達!\n難易度{0} / {1}日目 / 総売上 {2}G / 作った品 {3 /* ---------- Particles ---------- */
function burst(box,x,y,colors,n,o={}){
  if(!box)return;
  for(let i=0;i<n;i++){
    const d=document.createElement('div');const s=(o.size||6)*(0.6+Math.random()*0.9);
    d.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${colors[i%colors.length]};pointer-events:none;clip-path:${o.star?'polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)':'polygon(0 0,100% 20%,60% 100%)'}`;
    box.appendChild(d);
    const a=(o.dir!==undefined?o.dir:-Math.PI/2)+(Math.random()-.5)*(o.spread||Math.PI*1.2);
    const v=(o.v||80)*(0.5+Math.random());
    const dx=Math.cos(a)*v,dy=Math.sin(a)*v,g=o.g===undefined?90:o.g,r=(Math.random()-.5)*540;
    const dur=(o.dur||650)*(0.8+Math.random()*0.5);
    const an=d.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:`translate(${dx*.6}px,${dy*.6}px) rotate(${r*.5}deg) scale(1)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy+g}px) rotate(${r}deg) scale(.4)`,opacity:0}],{duration:dur,easing:'ease-out'});
    an.onfinish=()=>d.remove();
  }
}

}

function newRock(){const hp=Math.max(1,Math.round(DEPTHS[S.depth].hp*DF().hp));S.rock={hp,max:hp}}

function vMine(){
  if(!S.rock)newRock();
  const ch=chances();
  const dbtn=DEPTHS.map((d,i)=>{
    const open=i<=S.maxDepth,buy=i===S.maxDepth+1;
    const lbl=open?d.s:(buy?`🔒${d.s} ${d.cost}G`:`🔒${d.s}`);
    return `<button class="btn ${S.depth===i?'':'ghost'}" ${(!open&&(!buy||S.gold<d.cost))?'disabled':''} onclick="goDepth(${i})">${lbl}</button>`}).join('');
  return `<div class="card"><h3>⛏ ${DEPTHS[S.depth].n}</h3><div class="muted">${L2("深いほど岩は硬いけど、いい石が出やすい。ツルハシLv{0}",[S.pick])}</div>
  <div class="opts g2" style="margin-top:8px">${dbtn}</div>
  ${S.awake?`<div id="muBox" style="text-align:center;margin-top:8px">${muHtml()}</div>`:''}
  <div id="stage" onclick="mine()"><div id="rockwrap">${rockSvg(S.rock.hp/S.rock.max)}</div><div id="pick">${S.awake?PICK_GOLD:PICK_SVG}</div><div id="fx"></div></div>
  <div style="text-align:center">${ch.map((p,i)=>p>0?`<span class="pill">${GEMS[i].n} ${Math.max(1,Math.round(p*100))}%</span>`:'').join('')}</div></div>
  <div class="card"><h3>${L("原石袋")}</h3><div id="bag">${bagHtml()}</div></div>`;
}
function goDepth(i){

  else if(i===S.maxDepth+1&&S.gold>=DEPTHS[i].cost){S.gold-=DEPTHS[i].cost;S.maxDepth=i;S.depth=i;newRock();SFX.buy();toast(`${L2("⛏ {0}を開放!",[DEPTHS[i].n])}`);render()}
}
function pickGem(){
  const ws=chances();let t=Math.random();
  for(let i=0;i<ws.length;i++){t-=ws[i];if(t<=0)return i}
  return 0;
}

/* ---------- Craft ---------- */
function jewVal(gp,type,metal){
  return Math.round(gp*TY[type].m*MT[metal].gm*benchMul()+TY[type].cost[metal]*1.3);
}
const selGems=()=>craft.sel.map(id=>S.pol.find(p=>p.id===id)).filter(Boolean);
function gemPartOf(gs,type){
  if(type==='earring'&&gs.length===2)return (gemVal(gs[0].g,gs[0].s,gs[0].q)+gemVal(gs[1].g,gs[1].s,gs[1].q))*(1.2+(gs[0].s===gs[1].s?0.15:0));
  return gemVal(gs[0].g,gs[0].s,gs[0].q);
}
function pickCraft(id){
  const p=S.pol.find(x=>x.id===id);if(!p)return;
  if(craft.type!=='earring'){craft.sel=[id];render();return}
  const cur=selGems();
  if(craft.sel.includes(id))craft.sel=craft.sel.filter(x=>x!==id);
  else if(cur.length===0)craft.sel=[id];
  else if(cur[0].g===p.g)craft.sel=[cur[0].id,id];
  else craft.sel=[id];
  render();
}
function setType(k){craft.type=k;craft.sel=craft.sel.slice(0,k==='earring'?2:1);render()}
function vCraft(){

  const cost=TY[craft.type].cost[craft.metal];
  let prev='';
  if(ready){
    const v=jewVal(gemPartOf(gs,craft.type),craft.type,craft.metal);
    prev=`<div style="text-align:center;margin:8px 0">${jewSvg(gs[0].g,craft.type,craft.metal,72)}<div>${fullName(gs[0].g,craft.metal,craft.type)}${ear?L("(ペア)"):''}</div><div class="muted">${L2("金属代 {0}G ／ 完成品の価値 約 {1}G",[cost,v])}</div></div>

  }else if(ear)prev=`<div class="muted" style="margin:8px 0">${L2("同じ宝石を2個選んでね({0}/2)。大きさがそろうとお得だよ",[gs.length])}</div>`;

  <div class="card"><h3>${L2("① 宝石{0}",[ear?L("(同じ種類を2個)"):''])}</h3>${S.pol.length?`<div class="grid">${S.pol.map(p=>`<button ${ia(p.g,craft.sel.includes(p.id)?'sel':'')} onclick="pickCraft(${p.id})">${gemSvg(GEMS[p.g].c,36)}<div>${GEMS[p.g].n}</div><small>${L2("{0}・{1}",[SZ[p.s],grade(p.q)])}</small></button>`).join('')}</div>`:L("<div class=\"muted\">磨いた宝石がないよ。研磨へ✨</div>")}</div>

function doCraft(){
  const gs=selGems(),ear=craft.type==='earring';

  const nm=fullName(gs[0].g,craft.metal,craft.type);

const orderMinV=()=>[0,0,25,45,85,130][Math.min(rankIdx(),5)];
function pickOrderGem(){

  let t=w.reduce((a,b)=>a+b,0)*Math.random();

}
function reseedOrders(){const m=orderMinV();S.orders=S.orders.map(o=>(o.g!==null&&o.g!==undefined&&GEMS[o.g].v<m)?genOrder():o)}

}
function topUp(){

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=(t+Math.imul(t^t>>>7,61|t))^t;return((t^t>>>14)>>>0)/4294967296}}

  <button class="btn ghost" style="width:100%" onclick="closeOv()">${L("やめる")}</button></div>`;
}
function wpick(arr){const t=arr.reduce((a,b)=>a+b.max,0);let r=Math.random()*t;for(const b of arr){r-=b.max;if(r<=0)return b}return arr[arr.length-1]}
function simLot(j,mult){
  const {guests,mood}=aucGuests(aucDayFor(S.day));
  const bs=guests.map(g=>{let v=j.value*(0.7+Math.random()*0.6)*Math.sqrt(g.rich)*mood;if(g.fg.includes(j.g))v*=1.5;if(g.ft===j.type)v*=1.25;if(GEMS[j.g].r>=4)v*=1.2;v*=0.88+0.25*mult;v*=DF().sell;const bud=(S.aucBudget&&S.aucBudget[g.n]!==undefined)?S.aucBudget[g.n]:Infinity;return{g,max:Math.min(Math.round(v),bud)}});
  const inc=Math.max(1,Math.round(j.value*0.05)),start=Math.round(j.value*mult),ev=[];

  const rows=[[L("かかった日数"),`${L2("{0}日",[S.day])}`],[L("総売上"),Math.round(S.sold).toLocaleString()+' G'],[L("作った品"),`${L2("{0}個",[S.crafted||0])}`],[L("納めた注文"),`${L2("{0}件",[S.served])}`],[L("オークション落札"),`${L2("{0}件",[S.aucN||0])}`],[L("最高傑作"),S.best?`${bestName(S.best)}(${S.best.v.toLocaleString()}G)`:'—'],[L("図鑑"),Object.keys(S.dex||{}).length+' / '+GEMS.length],[L("難易度"),(S.clear>=0&&replay?`${L2("{0}(クリア時)",[DIFFS[S.clear].n])}`:DF().n)]];
  const stats=`<div style="margin:10px 0;text-align:left;font-size:13px">${rows.map(r=>`<div class="row" style="padding:3px 0;border-bottom:1px solid var(--line)"><span class="muted">${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div><button class="btn ghost" style="width:100%" onclick="copyResult()">${L("📋 結果をコピー(SNS用)")}</button>`;
  showStory({ic:'👑',title:L("エンディング — ありがとう、宝石職人さん"),paras:[L("広間は息をのみ、やがて大きな拍手が響いた。岩山の小さな採掘から始まった工房は、いまや王国一の宝飾工房になった。"),L("宝石は、掘る人、磨く人、飾る人、そして身につける人の想いがつながって、はじめて輝く。あなたの手が、そのすべてをつないだ。"),replay?'':L("ここから先は自由な時間。図鑑のコンプリートや、もっと高価な宝石づくりを、気がすむまで楽しんでね。")].filter(Boolean),extra:stats,btn:replay?L("閉じる"):L("ゲームを続ける"),cb:()=>{if(!replay){S.ending=true;S.clear=Math.max(S.clear===undefined?-1:S.clear,S.diff===undefined?1:S.diff);save();setTab('quest')}}});
  burst(document.getElementById('ov'),innerWidth/2,innerHeight/3,['#ffd35a','#fff','#ff9ad5','#7affc8','#7ab8ff'],80,{star:true,size:12,v:240,spread:Math.PI*2,dir:0,g:90,dur:1800});
}
function showEnding2(replay){
  SFX.fanfare();
  const rows=[[L("かかった日数"),`${L2("{0}日",[S.day])}`],[L("総売上"),Math.round(S.sold).toLocaleString()+' G'],[L("作った品"),`${L2("{0}個",[S.crafted||0])}`],[L("玉座の出来栄え"),`${L2("品質 {0}",[S.throne?S.throne.q:0])}`],[L("最高傑作"),S.best?`${bestName(S.best)}(${S.best.v.toLocaleString()}G)`:'—'],[L("図鑑"),Object.keys(S.dex||{}).length+' / '+GEMS.length]];
  const txt=`${L2("ジェムクラフト 修行モードで玉座まで完成!\n{0}日目 / 総売上 {1}G / 作った品 {2}個{3}\n#ジェムクラフト",[S.day,Math.round(S.sold).toLocaleString(),S.crafted||0,S.best?` ${L2("/ 最高傑作 {0}({1}G)",[bestName(S.best),S.best.v.toLocaleString()])}`:''])}`;
  window._res2=txt;
  const stats=`<div style="margin:10px 0;text-align:left;font-size:13px">${rows.map(r=>`<div class="row" style="padding:3px 0;border-bottom:1px solid var(--line)"><span class="muted">${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div><button class="btn ghost" style="width:100%" onclick="copyRes2()">${L("📋 結果をコピー(SNS用)")}</button>`;
  showStory({ic:'🌟',title:L("もうひとつのエンディング — 無双の工房"),paras:[L("修行の末に極みへ至った工房は、王国の歴史に「黄金の工房」として刻まれた。"),L("あなたが磨いた宝石は、これからも誰かの指で、胸元で、そして玉座で輝き続ける。道具に宿った魂も、きっとそれを見守っている。")],extra:stats,btn:replay?L("閉じる"):L("ゲームを続ける"),cb:()=>{if(!replay)setTab('quest')}});
  burst(document.getElementById('ov'),innerWidth/2,innerHeight/3,['#ffd35a','#fff3b0','#ffb300','#fff','#ff9ad5','#7ab8ff'],100,{star:true,size:12,v:260,spread:Math.PI*2,dir:0,g:90,dur:1900});
}
function vDex(){
  const found=GEMS.filter((g,i)=>S.dex&&S.dex[i]!==undefined).length;
  return `<div class="card"><h3>${L2("📖 宝石図鑑 {0} / {1}",[found,GEMS.length])}</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(78px,1fr))">${GEMS.map((g,i)=>{const q=S.dex?S.dex[i]:undefined,f=q!==undefined;return `<div ${f?ia(i):'class="item"'}>${f?gemSvg(g.c,32):L("<div style=\"height:32px;font-size:22px;opacity:.4\">？</div>")}<div style="font-size:10px">${f?g.n:L("？？？")}</div><small>${f?(q>0?`${L2("最高 {0}",[grade(q)])}`:L("原石のみ")):'&nbsp;'}</small></div>`}).join('')}</div>${found===GEMS.length?L("<div style=\"margin-top:6px;color:var(--acc)\">🎊 図鑑コンプリート!</div>"):''}</div>`;
}

/* ---------- Sell ---------- */
const priceWith=(j,sat)=>Math.round(j.value*S.dem[j.type]*eyeS()*DF().sell*Math.max(0.45,1-0.05*(sat[j.g]||0)));
const price=j=>priceWith(j,S.sat||{});
const gemPrice=p=>Math.round(gemVal(p.g,p.s,p.q)*0.6*DF().sell*satMult(p.g));
function simTotal(){const tmp={...(S.sat||{})};let t=0;for(const j of S.jew){t+=priceWith(j,tmp);tmp[j.g]=(tmp[j.g]||0)+1}return t}
function demLabel(d){return d>=1.2?L("<span class=\"up\">大人気🔥</span>"):d<=0.85?L("<span class=\"dn\">不人気</span>"):L("ふつう")}
function vSell(){
  const total=simTotal();
  const satPills=Object.keys(S.sat||{}).filter(k=>S.sat[k]>=1).map(k=>`<span class="pill dn">${GEMS[k].n} ▼${Math.round((1-satMult(k))*100)}%</span>`).join('');
  const fc=fulfillable();
  return `<div class="card"><h3>${L("💰 今日の需要")}</h3>${Object.keys(TY).map(k=>`<span class="pill">${TY[k].n} ×${S.dem[k].toFixed(2)} ${demLabel(S.dem[k])}</span>`).join('')}<div class="muted" style="margin-top:6px">${L("需要は毎朝変わるよ。人気の日に売るのがコツ")}</div>${satPills?`<div style="margin-top:6px" class="muted">${L("供給過多(同じ宝石を続けて売ると下がる。数日で戻る)")}</div>${satPills}`:''}</div>
  ${fc?`<div class="card" onclick="setTab('order')" style="border-color:var(--acc)"><div>${L2("📜 注文に合う完成品が{0}件あるよ。注文のほうが高く売れる!",[fc])}</div></div>`:''}
  <div class="card"><h3>${L("完成品を売る")}</h3>${S.jew.length?`<div class="grid">${S.jew.map(j=>`<button ${ia(j.g)} onclick="sellJ(${j.id})">${jewSvg(j.g,j.type,j.metal,40)}<div>${jN(j.g,j.type)}</div><small>${L2("売る {0}G",[price(j)])}</small></button>`).join('')}</div><button class="btn" style="width:100%;margin-top:10px" onclick="sellAll()">${L2("ぜんぶ売る({0}G)",[total.toLocaleString()])}</button>`:L("<div class=\"muted\">売るものがないよ</div>")}</div>
  <div class="card"><h3>${L("宝石のまま売る(6割)")}</h3>${S.pol.length?`<div class="grid">${S.pol.map(p=>`<button ${ia(p.g)} onclick="sellG(${p.id})">${gemSvg(GEMS[p.g].c,36)}<div>${GEMS[p.g].n}</div><small>${gemPrice(p)}G</small></button>`).join('')}</div>`:L("<div class=\"muted\">なし</div>")}</div>`;
}
const QUEST_AT=50000;
function gain(n){S.gold+=n;S.sold+=n;if(S.quest.stage===0&&S.sold>=QUEST_AT){S.quest.stage=1;S.questNew=true}}
function dexMark(g,q){if(!S.dex)S.dex={};if(S.dex[g]===undefined||q>S.dex[g])S.dex[g]=q}
function sellJ(id){const j=S.jew.find(x=>x.id===id);if(!j)return;const p=price(j);S.jew=S.jew.filter(x=>x.id!==id);satBump(j.g);gain(p);SFX.coin();toast('+'+p+'G');render()}
function sellAll(){let t=0;for(const j of S.jew){t+=price(j);satBump(j.g)}S.jew=[];gain(t);SFX.coin();toast('+'+t.toLocaleString()+'G');render()}
function sellG(id){const p=S.pol.find(x=>x.id===id);if(!p)return;const v=gemPrice(p);S.pol=S.pol.filter(x=>x.id!==id);satBump(p.g);gain(v);SFX.coin();toast('+'+v+'G');render()}

/* ---------- Shop ---------- */
const UPS=[
 ['pick',L("⛏ ツルハシ"),L("掘る威力アップ。レアな石も出やすくなる(Lv6・Lv11以降は伸びがゆるやか)")],
 ['wheel',L("✨ 研磨機"),L("緑の帯が広がって研磨が楽になる")],
 ['bench',L("🔨 作業台"),L("完成品の価値が +10%/Lv(Lv11以降は+3%)")],
 ['bag',L("🎒 体力袋"),L("最大体力が +5/Lv(Lv11以降は+2)")],
 ['eye',L("🔍 目利き"),L("注文の報酬 +5%/Lv、売却価格 +2%/Lv(Lv11以降は小さめ)")],
 ['app',L("🧑‍🔧 弟子"),L("Lv2から雇用。毎朝、今いる層で原石を掘ってきてくれる(Lv2〜3:1個、Lv4〜5:2個…)")]
];
function vDiff(){
  return `<div class="card"><h3>${L("🎚 難易度")}</h3><div class="opts g2">${DIFFS.map((d,i)=>`<button class="btn ${S.diff===i?'':'ghost'}" onclick="setDiff(${i})">${d.n}</button>`).join('')}</div><div class="muted" style="margin-top:6px">${diffText(DF())}</div><div class="muted">${L2("「修行」は強化が進んだ上級者向け(最初からだと体力が足りなくなるよ)。途中でいつでも変えられる。{0}",[S.clear>=0?L("クリア済みの最高難易度: ")+DIFFS[S.clear].n:''])}</div></div>`;
}
function setDiff(i){S.diff=i;if(S.rock)newRock();SFX.buy();toast(`${L2("難易度: {0}",[DIFFS[i].n])}`);render()}
function vShop(){
  return vDiff()+UPS.map(u=>{const lv=S[u[0]];const c=lv<MAXLV?Math.round(UP[lv-1]*upMul()):0;
    const cur=u[0]==='app'&&lv===1?L("(未雇用)"):'';
    return `<div class="card"><div class="row"><div><h3>${u[1]} Lv${lv}${cur}</h3><div class="muted">${u[2]}</div></div>${c?`<button class="btn sm" ${S.gold<c?'disabled':''} onclick="buyUp('${u[0]}')">${c.toLocaleString()}G</button>`:'<span class="pill">MAX</span>'}</div></div>`}).join('')
   +`<div class="card"><div class="muted">${L2("鉱山の深い層は「採掘」タブで開放、体力は右上の宿屋で回復できるよ。納品した注文: {0}件",[S.served])}</div></div>`+vDex();
}
function buyUp(k){const lv=S[k];if(lv>=MAXLV)return;const c=Math.round(UP[lv-1]*upMul());if(S.gold<c)return;S.gold-=c;S[k]++;SFX.buy();toast(L("強化した!"));render()}

/* ---------- Inn ---------- */
const FOODS=[
 {n:L("🍞 パン"),e:8,p:30,d:L("手軽に体力+8")},
 {n:L("🍱 定食"),e:20,p:90,d:L("しっかり体力+20")},
 {n:L("♨️ 温泉"),e:15,p:150,d:L("体力+15、今日は研磨の緑の帯が広がる")}
];
const foodPrice=f=>Math.round(f.p*Math.pow(1.7,S.eat)*DF().cost/5)*5;
function openInn(){
  const ov=document.getElementById('ov');ov.onclick=null;ov.classList.add('on');
  ov.innerHTML=`<div class="modal"><h3 style="margin:0 0 4px;color:var(--acc)">${L("🏨 宿屋")}</h3><div class="muted">${L2("今日の注文: {0}回 — 頼むほど値段が上がるよ(1回ごとに×1.7)。朝になるとリセット。",[S.eat])}</div>
  <div style="margin:10px 0;font-weight:700">⚡ ${S.energy} / ${maxE()}${S.buff?L("　♨️ほかほか中"):''}</div>
  ${FOODS.map((f,i)=>{const pr=foodPrice(f);return `<div class="card" style="text-align:left;margin-bottom:8px"><div class="row"><div><b>${f.n}</b><div class="muted">${f.d}</div></div><button class="btn sm" ${(S.gold<pr||S.energy>=maxE())?'disabled':''} onclick="buyFood(${i})">${pr}G</button></div></div>`}).join('')}
  <button class="btn ghost" style="width:100%" onclick="closeOv()">${L("閉じる")}</button></div>`;
}
function buyFood(i){
  const f=FOODS[i],pr=foodPrice(f);
  if(S.gold<pr||S.energy>=maxE()){SFX.err();return}
  ac();S.gold-=pr;S.energy=Math.min(maxE(),S.energy+f.e);S.eat++;if(i===2)S.buff=true;
  SFX.buy();header();save();openInn();toast(`${L2("{0} 体力 +{1}",[f.n,f.e])}`);
}

/* ---------- Day / reset ---------- */
const BEDS=[
 {n:L("🌾 野宿"),f:.4,p:0,d:L("無料。体力は4割だけ回復")},
 {n:L("🛏 安宿"),f:.75,p:60,d:L("体力が7.5割回復")},
 {n:L("🏰 上等な部屋"),f:1,p:220,d:L("体力が全回復 + 翌日は研磨の緑の帯が広がる")}
];
const rankIdx=()=>{let k=0;RANKS.forEach((r,i)=>{if(S.sold>=r[0])k=i});return k};
const bedPrice=b=>Math.round(b.p*(1+0.7*rankIdx())*DF().cost/5)*5;
const bedGain=b=>Math.round(maxE()*b.f);
function sleep(){
  const ov=document.getElementById('ov');ov.onclick=null;ov.classList.add('on');
  ov.innerHTML=`<div class="modal"><h3 style="margin:0 0 4px;color:var(--acc)">${L("🌙 どこで眠る?")}</h3><div class="muted">${L("体力は残りに足される(最大まで)。称号が上がると宿代も上がるよ。")}</div><div class="muted">${L2("今夜の維持費(工房・税金): {0}G",[upkeep().toLocaleString()])}</div>
  <div style="margin:10px 0;font-weight:700">⚡ ${S.energy} / ${maxE()}</div>
  ${BEDS.map((b,i)=>{const pr=bedPrice(b),after=Math.min(maxE(),S.energy+bedGain(b));return `<div class="card" style="text-align:left;margin-bottom:8px"><div class="row"><div><b>${b.n}</b><div class="muted">${b.d}</div><div class="muted">${L2("→ 体力 {0} / {1}",[after,maxE()])}</div></div><button class="btn sm" ${S.gold<pr?'disabled':''} onclick="doSleep(${i})">${pr?pr+'G':L("無料")}</button></div></div>`}).join('')}
  <button class="btn ghost" style="width:100%" onclick="closeOv()">${L("やめる")}</button></div>`;
}
function doSleep(i){
  const b=BEDS[i],pr=bedPrice(b);
  if(S.gold<pr)return;
  const up=upkeep();S.gold-=pr;S.gold=Math.max(0,S.gold-up);satDecay();
  S.day++;S.energy=Math.min(maxE(),S.energy+bedGain(b));S.dem=newDemand();S.eat=0;S.buff=(i===2);
  topUp();
  let msg=`${L2("🌙 {0}日目の朝。新しい注文も届いたよ",[S.day])}`+(up?`
${L2("🏠 維持費 -{0}G",[up.toLocaleString()])}`:'')+(S.day%3===0?L("\n🔨 今日はオークションの開催日!"):'');
  const n=S.app>=2?Math.ceil((S.app-1)/2):0;
  if(n){
    let best=0;
    for(let k=0;k<n;k++){const g=pickGem(),r=Math.random(),dd=S.depth*0.06,sz=r<0.6-dd?0:r<0.9-dd?1:2;S.rough.push({id:S.uid++,g,s:sz});dexMark(g,0);best=Math.max(best,GEMS[g].r)}
    msg+=`
${L2("🧑‍🔧 弟子が原石を{0}個掘ってきたよ",[n])}`+(best>=2?L("(いい石も混じってる!)"):'');
  }
  SFX.morning();
  const ov=document.getElementById('ov');ov.classList.remove('on');ov.innerHTML='';
  toast(msg);render();
}
function resetAll(){
  const ov=document.getElementById('ov');ov.onclick=null;ov.classList.add('on');
  ov.innerHTML=`<div class="modal"><div style="margin-bottom:12px">${L("セーブデータを消して最初からやり直す?")}</div><div class="opts"><button class="btn ghost" onclick="closeOv()">${L("やめる")}</button><button class="btn" onclick="fresh()">${L("やり直す")}</button></div></div>`;
}
function fresh(){S=S0();topUp();craft.sel=[];closeOv()}
if(!S.orders.length)topUp();
reseedOrders();
[...S.rough,...S.pol,...S.jew].forEach(x=>dexMark(x.g,x.q||0));
render();
</script>
</body>
</html>
